# Alembic configuration.
#
# Note there is deliberately no `sqlalchemy.url` here: the URL comes from
# Settings (and therefore the environment) in alembic/env.py. Putting it in
# this file would mean maintaining the connection string in two places, and
# would bake credentials into a tracked file.
[alembic]
script_location = alembic

# Timestamped revision filenames, so `versions/` reads in chronological order
# instead of as a pile of opaque hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
